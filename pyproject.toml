[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pocketflow"
version = "0.1.0"
description = "Framework de fluxo de tarefas para agentes de IA"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
authors = [
    {name = "WISP Team", email = "contato@wispcorp.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "httpx>=0.23.0",
    "uvicorn>=0.17.6",
    "starlette>=0.20.0",
    "sse-starlette>=1.0.0",
    "pydantic>=1.9.0",
]

[project.urls]
"Homepage" = "https://github.com/allanbrunobr/pocketflow"
"Bug Tracker" = "https://github.com/allanbrunobr/pocketflow/issues"